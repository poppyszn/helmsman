# The Helmsman server host: Helmsman, its Postgres, and optionally Caddy for TLS.
# Deployed by .github/workflows/deploy.yml, which copies this folder to the server and runs ./up.sh.
# The server image comes from helmsman.version. Start and manage the stack with ./up.sh (it is docker compose
# with that image and .env), not with plain docker compose.
#
# Which optional services run is chosen in .env with COMPOSE_PROFILES (caddy). Third-party images are pinned by
# digest; update them on purpose, not by tag.
#
# Not included: log history (Loki and Alloy) and the backup sidecar. Back up Postgres some other way until the
# Helmsman roadmap covers them for this layout.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: helmsman
      POSTGRES_DB: helmsman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Used once, on first boot, to create the login role the server runs as.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00-app-role.sh:/docker-entrypoint-initdb.d/00-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmsman -d helmsman"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  server:
    image: ${HELMSMAN_IMAGE:?start it with ./up.sh, which reads helmsman.version}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [.env]
    environment:
      IDP_LISTEN: ":8080"
      # Migrations run as the table owner; the server itself runs as the limited helmsman_app role.
      IDP_MIGRATE_DATABASE_URL: postgres://helmsman:${POSTGRES_PASSWORD}@postgres:5432/helmsman?sslmode=disable
      IDP_DATABASE_URL: postgres://helmsman_app:${APP_DB_PASSWORD}@postgres:5432/helmsman?sslmode=disable
      IDP_CATALOG_PATH: /etc/helmsman/catalog/apps.yaml
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      # The catalog lives in this repository, so a change goes through a pull request and a deploy. The folder is
      # mounted (not the single file) so a replaced file is seen. The server reloads it within 30 seconds.
      - ./catalog:/etc/helmsman/catalog:ro
      - ${GITHUB_APP_KEY_FILE:?set GITHUB_APP_KEY_FILE to the App private key}:/run/secrets/github-app.pem:ro
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      # distroless has no shell or wget, so the server checks itself.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  # Profile "caddy": TLS in front of the server. With a public DNS name Caddy gets a Let's Encrypt
  # certificate by itself (ports 80 and 443 must reach this host). For a private name set
  # CADDY_TLS=tls internal and trust Caddy's root certificate. Skip this profile if nginx on the
  # host does TLS instead (see docs/server-setup.md in the Helmsman repository).
  caddy:
    profiles: [caddy]
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      IDP_HOST: ${IDP_HOST:?set IDP_HOST to the DNS name of this server}
      CADDY_TLS: ${CADDY_TLS:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [server]
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  pgdata: {}
  caddy-data: {}
  caddy-config: {}
