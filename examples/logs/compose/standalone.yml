# Loki, Alloy (containers and Faro) and optionally Grafana on one machine, without the rest of Helmsman. Use
# it to try the pipeline, or as the log stack for a host Helmsman reads from. From examples/logs/compose:
#
#   export DOCKER_GID=$(stat -c %g /var/run/docker.sock)     # macOS Docker Desktop: use 0
#   export FARO_ALLOWED_ORIGINS=http://localhost:8080          # the origins of your web apps
#   export LOG_PROJECTS='.+'                                   # compose projects to collect
#   docker compose -f standalone.yml up -d                     # Loki and Alloy
#   docker compose -f standalone.yml --profile alerts up -d    # plus Grafana, with Loki and three alert rules
#
# Then connect Loki in Helmsman (Integrations) with its address as the Helmsman server reaches it.
services:
  loki:
    image: grafana/loki@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../loki/loki-local.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
    mem_limit: 768m

  alloy:
    image: grafana/alloy@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/all-in-one.alloy"]
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      LOG_PROJECTS: ${LOG_PROJECTS:-.+}
      HOST_NAME: ${HOST_NAME:-local}
      FARO_ALLOWED_ORIGINS: ${FARO_ALLOWED_ORIGINS:-*}
    user: "473:473"
    group_add: ["${DOCKER_GID:?set DOCKER_GID to the group id of /var/run/docker.sock}"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ../alloy/all-in-one.alloy:/etc/alloy/all-in-one.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports: ["${FARO_PORT:-12347}:12347"]
    depends_on: [loki]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  grafana:
    profiles: [alerts]
    image: grafana/grafana@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [loki]
    mem_limit: 512m

volumes:
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
