# nginx for a static web app, written so that Helmsman's history reads it cleanly.
# Everything goes to stdout and stderr, which is what Docker (and so Alloy) collects.

# Option 1 (nothing to do): the default "combined" format is recognised as it is.
# Option 2: one JSON object per line. Helmsman recognises a line with "status" and "request".
log_format json escape=json
  '{"time":"$time_iso8601","remote":"$remote_addr","request":"$request","status":$status,'
  '"bytes":$body_bytes_sent,"ms":"$request_time","referer":"$http_referer","agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json;     # use "access_log /dev/stdout;" for the default format
    error_log  /dev/stderr warn;     # "warn" keeps notices out; use "error" for even less

    # Single page apps: send unknown paths to index.html (and still count real 404s for files).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A health endpoint for the Helmsman catalog (health.url), kept out of the access log so it does not drown it.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
