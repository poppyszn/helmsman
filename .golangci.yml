version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        # CloseNow is a best-effort teardown of a connection that is already finished or failing.
        - (*github.com/coder/websocket.Conn).CloseNow
  exclusions:
    presets:
      # Close, Fprint*, and similar calls whose error nobody can act on.
      - std-error-handling
