# Home pilot overlay. Adds TLS (Caddy with its own CA), an S3 compatible bucket (Adobe S3Mock) and a
# scheduled backup to it. Use it on top of compose.server.yml:
#
#   docker compose -f deploy/compose.server.yml -f deploy/compose.pilot.yml --env-file .env up -d --build
#
# S3Mock is a test double: it keeps the data in a Docker volume on this same machine. That protects
# against a corrupted database or a bad upgrade, not against losing the disk. Copy the volume (or
# `docker compose ... run --rm backup list` output) to another machine now and then.
services:
  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      IDP_HOST: ${IDP_HOST:?set IDP_HOST to the LAN name or IP of this server}
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [idp]
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  s3:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${BACKUP_BUCKET:-helmsman-backups}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  backup:
    build: { context: .., dockerfile: deploy/docker/backup.Dockerfile }
    restart: unless-stopped
    depends_on:
      # Wait for the server so its migrations have created the tables. A dump of an empty database
      # is refused by the sidecar as too small to be a real backup.
      idp: { condition: service_healthy }
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: helmsman
      PGDATABASE: helmsman
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-helmsman-backups}
      BACKUP_TIME: ${BACKUP_TIME:-02:15}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: "true"
      TZ: ${TZ:-Africa/Lagos}
      AWS_ENDPOINT_URL: http://s3:9090
      AWS_ACCESS_KEY_ID: local          # S3Mock ignores credentials but the AWS CLI needs some
      AWS_SECRET_ACCESS_KEY: local
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  caddy-data: {}
  caddy-config: {}
  s3-data: {}
