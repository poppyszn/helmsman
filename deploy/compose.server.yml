# IDP host: Helmsman server and its Postgres. nginx on the host terminates TLS and proxies to
# 127.0.0.1:8080 (see deploy/nginx/idp.conf). Copy deploy/env.server.example to .env first.
#
#   docker compose -f deploy/compose.server.yml --env-file .env up -d
#
# Images are pinned by digest. IDP_IMAGE comes from the publish workflow, for example
# ghcr.io/poppyszn/helmsman-server@sha256:... . Update the postgres digest on purpose, not by tag.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: helmsman
      POSTGRES_DB: helmsman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Used once, on first boot, to create the login role the server runs as.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00-app-role.sh:/docker-entrypoint-initdb.d/00-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmsman -d helmsman"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  idp:
    image: ${IDP_IMAGE:?set IDP_IMAGE to the server image digest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [../.env]
    environment:
      IDP_LISTEN: ":8080"
      # Migrations run as the table owner; the server itself runs as the limited helmsman_app role.
      IDP_MIGRATE_DATABASE_URL: postgres://helmsman:${POSTGRES_PASSWORD}@postgres:5432/helmsman?sslmode=disable
      IDP_DATABASE_URL: postgres://helmsman_app:${APP_DB_PASSWORD}@postgres:5432/helmsman?sslmode=disable
      IDP_CATALOG_PATH: /etc/helmsman/catalog/apps.yaml
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      # The catalog lives in git. Check it out on the host and mount the directory read-only.
      - ${CATALOG_DIR:?set CATALOG_DIR to the host directory holding apps.yaml}:/etc/helmsman/catalog:ro
      - ${GITHUB_APP_KEY_FILE:?set GITHUB_APP_KEY_FILE to the App private key}:/run/secrets/github-app.pem:ro
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      # distroless has no shell or wget, so the server checks itself.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

volumes:
  pgdata: {}
