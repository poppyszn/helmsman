# The IDP host: Helmsman, its Postgres, and optionally TLS (Caddy) and S3 backups.
# Deployed by .github/workflows/deploy.yml, which pulls ghcr.io/<owner>/helmsman-server:<commit sha>
# and restarts only the `server` service. The other services are started once by hand (see
# docs/server-setup.md) and then keep running between deploys.
#
#   cp env.example .env       # next to this file, never committed
#   docker compose --env-file .env up -d
#
# Which optional services run is chosen in .env with COMPOSE_PROFILES (caddy, backup, logs).
# Third-party images are pinned by digest; update them on purpose, not by tag.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: helmsman
      POSTGRES_DB: helmsman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Used once, on first boot, to create the login role the server runs as.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00-app-role.sh:/docker-entrypoint-initdb.d/00-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmsman -d helmsman"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Named after the app so the deploy pipeline can address it: ghcr.io/<owner>/<repo>-server.
  server:
    image: ghcr.io/poppyszn/helmsman-server:${IMAGE_TAG:-latest-develop}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [.env]
    environment:
      IDP_LISTEN: ":8080"
      # Migrations run as the table owner; the server itself runs as the limited helmsman_app role.
      IDP_MIGRATE_DATABASE_URL: postgres://helmsman:${POSTGRES_PASSWORD}@postgres:5432/helmsman?sslmode=disable
      IDP_DATABASE_URL: postgres://helmsman_app:${APP_DB_PASSWORD}@postgres:5432/helmsman?sslmode=disable
      IDP_CATALOG_PATH: /etc/helmsman/catalog/apps.yaml
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      # The catalog is part of the repository, so a change goes through a pull request and a deploy.
      # The server notices the new file within 30 seconds, no restart needed.
      - ./apps.yaml:/etc/helmsman/catalog/apps.yaml:ro
      - ${GITHUB_APP_KEY_FILE:?set GITHUB_APP_KEY_FILE to the App private key}:/run/secrets/github-app.pem:ro
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      # distroless has no shell or wget, so the server checks itself.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  # Profile "caddy": TLS in front of the server. With a public DNS name Caddy gets a Let's Encrypt
  # certificate by itself (ports 80 and 443 must reach this host). For a private name set
  # CADDY_TLS=tls internal and trust Caddy's root certificate. Skip this profile if nginx on the
  # host does TLS instead (deploy/nginx/idp.conf).
  caddy:
    profiles: [caddy]
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      IDP_HOST: ${IDP_HOST:?set IDP_HOST to the DNS name of this server}
      CADDY_TLS: ${CADDY_TLS:-}
      LOKI_PUSH_USER: ${LOKI_PUSH_USER:-}
      LOKI_PUSH_PASSWORD_HASH: ${LOKI_PUSH_PASSWORD_HASH:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional routes (the Faro endpoint and authenticated log push). Copy logs.caddy.example to
      # logs.caddy to enable them.
      - ./caddy/logs:/etc/caddy/logs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [server]
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Profile "logs": log history. Loki stores it (14 days, local disk). Alloy reads this host's container
  # logs, and receives browser telemetry from Grafana Faro (static and single page apps post to
  # https://<IDP_HOST>/faro/collect). Helmsman reads Loki to show history beside the live tail, and Grafana
  # can read the same Loki for alerts. See docs/logs.md.
  loki:
    profiles: [logs]
    image: grafana/loki@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    # The Loki image has no shell or wget, so there is no container healthcheck. Check it with
    # `docker compose exec alloy wget -qO- http://loki:3100/ready` or from Helmsman's history view.
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  alloy:
    profiles: [logs]
    image: grafana/alloy@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy-config"]
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      # Containers of these compose projects are shipped to Loki. The default is every project on this host.
      LOG_PROJECTS: ${LOG_PROJECTS:-.+}
      # Must equal the agent id of this host in the catalog, so history for an environment never mixes with
      # the same compose project on another host.
      HOST_NAME: ${LOG_HOST_NAME:?set LOG_HOST_NAME to this host's agent id}
      FARO_ALLOWED_ORIGINS: ${FARO_ALLOWED_ORIGINS:?set FARO_ALLOWED_ORIGINS to the origins of your web apps}
    # Runs as the image's own alloy user (473) and joins the host's docker group to read the socket.
    # DOCKER_GID is the group id of /var/run/docker.sock (stat -c %g /var/run/docker.sock).
    user: "473:473"
    group_add: ["${DOCKER_GID:?set DOCKER_GID to the group id of /var/run/docker.sock}"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ../alloy/write.alloy:/etc/alloy-config/write.alloy:ro
      - ../alloy/collector.alloy:/etc/alloy-config/collector.alloy:ro
      - ../alloy/faro.alloy:/etc/alloy-config/faro.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki: { condition: service_started }
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Profile "backup": an S3 compatible bucket (Adobe S3Mock) and a nightly pg_dump into it.
  # S3Mock keeps its data in a volume on this host, so it covers a bad upgrade or a corrupted
  # database, not the loss of the disk. Point AWS_ENDPOINT_URL at a real S3 provider to change that.
  s3:
    profiles: [backup]
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${BACKUP_BUCKET:-helmsman-backups}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  backup:
    profiles: [backup]
    build: { context: ../.., dockerfile: deploy/docker/backup.Dockerfile }
    restart: unless-stopped
    depends_on:
      # Wait for the server so its migrations have created the tables. A dump of an empty database
      # is refused by the sidecar as too small to be a real backup.
      server: { condition: service_healthy }
      s3: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: helmsman
      PGDATABASE: helmsman
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-helmsman-backups}
      BACKUP_TIME: ${BACKUP_TIME:-02:15}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: "true"
      TZ: ${TZ:-Africa/Lagos}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://s3:9090}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}          # S3Mock ignores credentials but the AWS CLI needs some
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
    volumes:
      # The script comes from the repository, so a deploy updates it. Restart the container to use it.
      - ../backup/sidecar.sh:/usr/local/bin/backup:ro
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  pgdata: {}
  loki-data: {}
  alloy-data: {}
  caddy-data: {}
  caddy-config: {}
  s3-data: {}
