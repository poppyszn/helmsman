# nginx on the IDP host. Terminates TLS and proxies to the server on 127.0.0.1:8080.
# Replace idp.example.com and the certificate paths (certbot's defaults are shown).
# Include this file from /etc/nginx/conf.d/ or sites-enabled/.

# Keep the connection upgrade logic in one place.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Brute-force brake for the sign-in endpoints, on top of the server's own limits.
limit_req_zone $binary_remote_addr zone=idp_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name idp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name idp.example.com;

    ssl_certificate     /etc/letsencrypt/live/idp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:idp_ssl:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 64k;

    # The server reads the client address from X-Forwarded-For. nginx sets it from the real peer,
    # so a client cannot choose its own.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Agents dial out to this endpoint and stay connected, and browsers hold log streams open.
    location ~ ^/(agent/ws|ws/) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    location /auth/ {
        limit_req zone=idp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location /agent/join {
        limit_req zone=idp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 70s;
    }
}
