name: "CI: Checks"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helmsman
          POSTGRES_PASSWORD: test
          POSTGRES_DB: helmsman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helmsman" --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://helmsman:test@localhost:5432/helmsman?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: go vet ./...
      # Packages share one test database, so they run one at a time.
      - run: go test -race -p 1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [go, web]
    strategy:
      matrix:
        image: [server, agent]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          load: true
          tags: helmsman-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helmsman-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The server compose file reads ../.env. CI has none, so an empty one stands in.
      - run: touch .env
      - run: docker compose -f deploy/compose.dev.yml config -q
      - run: docker compose -f deploy/compose.agent.yml config -q
        env:
          DOCKER_GID: "999"
          AGENT_VERSION: latest
      - name: Server compose resolves, with every optional profile on
        run: |
          touch deploy/server/.env
          docker compose -f deploy/server/compose.yml config -q
        env:
          COMPOSE_PROFILES: caddy,backup,logs
          IMAGE_TAG: ci
          POSTGRES_PASSWORD: ci
          APP_DB_PASSWORD: ci
          GITHUB_APP_KEY_FILE: /tmp/key.pem
          IDP_HOST: idp.ci.test
          DOCKER_GID: "999"
          LOG_HOST_NAME: ci
          FARO_ALLOWED_ORIGINS: https://app.ci.test
      - name: Alloy compose for app hosts resolves
        run: docker compose -f deploy/compose.alloy.yml config -q
        env:
          LOKI_URL: https://idp.ci.test/loki/api/v1/push
          LOKI_PASSWORD: ci
          LOG_PROJECTS: ci
          ALLOY_HOST_NAME: ci
          DOCKER_GID: "999"
      - name: Alloy and Loki configuration is valid
        run: |
          for f in write collector faro; do
            docker run --rm -v "$PWD/deploy/alloy":/c grafana/alloy:v1.21.3 fmt "/c/$f.alloy" > /dev/null
          done
          docker run --rm -v "$PWD/deploy/loki":/c grafana/loki:3.7.9 -config.file=/c/loki.yaml -verify-config
      - name: Third party images in the server compose are pinned by digest
        run: |
          if grep -nE '^\s+image:' deploy/server/compose.yml deploy/compose.alloy.yml | grep -v '@sha256:' | grep -v 'helmsman-server'; then
            echo "an image in the server or Alloy compose file is not pinned by digest" >&2; exit 1
          fi
      - name: Host preflight rejects an empty environment
        run: |
          cd deploy/server
          : > .env
          if bash preflight.sh; then echo "preflight accepted an empty .env" >&2; exit 1; fi
      - name: Shell scripts parse
        run: for f in deploy/backup/*.sh deploy/server/db/*.sh deploy/server/preflight.sh; do bash -n "$f"; done
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          # The dev image runs as root on purpose (hot reload over a bind mount). It is never deployed.
          skip-files: deploy/docker/server.dev.Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start the dev stack, with Loki and Alloy for the log history tests
        run: make up-logs
      - name: Playwright end-to-end tests
        run: make e2e
      - name: Dev stack logs
        if: failure()
        run: docker compose -f deploy/compose.dev.yml logs --tail 200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
